<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" font-family="Segoe UI, Arial, sans-serif">
  <!-- ER-диаграмма БД (users 1—∞ orders ∞—1 services). Откройте в браузере,
       экспортируйте в PNG (или откройте в Inkscape / draw.io). -->
  <rect width="860" height="520" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111">ER-диаграмма базы данных «exam_db»</text>

  <!-- ======================= users ======================= -->
  <g>
    <rect x="40" y="90" width="240" height="220" rx="8" fill="#f7f8fa" stroke="#333" stroke-width="2"/>
    <rect x="40" y="90" width="240" height="34" rx="8" fill="#333"/>
    <text x="160" y="113" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">users (пользователи)</text>
    <line x1="40" y1="124" x2="280" y2="124" stroke="#333"/>
    <text x="56" y="148" font-size="14" fill="#111">🔑 id            INT, PK, AI</text>
    <text x="56" y="172" font-size="14" fill="#111">login         VARCHAR, UNIQUE</text>
    <text x="56" y="196" font-size="14" fill="#111">password   VARCHAR</text>
    <text x="56" y="220" font-size="14" fill="#111">fio              VARCHAR</text>
    <text x="56" y="244" font-size="14" fill="#111">phone        VARCHAR</text>
    <text x="56" y="268" font-size="14" fill="#111">email         VARCHAR</text>
    <text x="56" y="292" font-size="14" fill="#111">created_at  DATETIME</text>
  </g>

  <!-- ======================= orders ======================= -->
  <g>
    <rect x="310" y="60" width="250" height="300" rx="8" fill="#f7f8fa" stroke="#333" stroke-width="2"/>
    <rect x="310" y="60" width="250" height="34" rx="8" fill="#333"/>
    <text x="435" y="83" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">orders (заявки)</text>
    <line x1="310" y1="94" x2="560" y2="94" stroke="#333"/>
    <text x="326" y="118" font-size="14" fill="#111">🔑 id              INT, PK, AI</text>
    <text x="326" y="142" font-size="14" fill="#111">🔗 user_id      INT, FK</text>
    <text x="326" y="166" font-size="14" fill="#111">address        VARCHAR</text>
    <text x="326" y="190" font-size="14" fill="#111">phone          VARCHAR</text>
    <text x="326" y="214" font-size="14" fill="#111">🔗 service_id  INT, FK, NULL</text>
    <text x="326" y="238" font-size="14" fill="#111">other_service VARCHAR</text>
    <text x="326" y="262" font-size="14" fill="#111">desired_date  DATETIME</text>
    <text x="326" y="286" font-size="14" fill="#111">payment_type VARCHAR</text>
    <text x="326" y="310" font-size="14" fill="#111">status          VARCHAR</text>
    <text x="326" y="334" font-size="14" fill="#111">cancel_reason VARCHAR</text>
  </g>

  <!-- ======================= services ======================= -->
  <g>
    <rect x="600" y="120" width="220" height="130" rx="8" fill="#f7f8fa" stroke="#333" stroke-width="2"/>
    <rect x="600" y="120" width="220" height="34" rx="8" fill="#333"/>
    <text x="710" y="143" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">services (услуги)</text>
    <line x1="600" y1="154" x2="820" y2="154" stroke="#333"/>
    <text x="616" y="178" font-size="14" fill="#111">🔑 id          INT, PK, AI</text>
    <text x="616" y="202" font-size="14" fill="#111">name       VARCHAR</text>
    <text x="616" y="226" font-size="14" fill="#111">is_active  TINYINT</text>
  </g>

  <!-- связь users 1 — ∞ orders -->
  <line x1="280" y1="200" x2="310" y2="200" stroke="#333" stroke-width="2"/>
  <text x="288" y="193" font-size="13" fill="#333">1</text>
  <text x="296" y="216" font-size="13" fill="#333">∞</text>

  <!-- связь services 1 — ∞ orders -->
  <line x1="560" y1="214" x2="600" y2="185" stroke="#333" stroke-width="2"/>
  <text x="566" y="210" font-size="13" fill="#333">∞</text>
  <text x="585" y="182" font-size="13" fill="#333">1</text>

  <text x="40" y="400" font-size="13" fill="#555">Связи: один пользователь — много заявок (users.id → orders.user_id);</text>
  <text x="40" y="420" font-size="13" fill="#555">одна услуга — во многих заявках (services.id → orders.service_id, NULL при «Иной услуге»).</text>
  <text x="40" y="446" font-size="12" fill="#888">🔑 — первичный ключ (PK),  🔗 — внешний ключ (FK).</text>
</svg>
