<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111">ER-диаграмма базы данных «exam_db»</text>

  <!-- users -->
  <g>
    <rect x="40" y="80" width="230" height="200" rx="8" fill="#f7f8fa" stroke="#333" stroke-width="2"/>
    <rect x="40" y="80" width="230" height="32" rx="8" fill="#333"/>
    <text x="155" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">users (пользователи)</text>
    <text x="54" y="134" font-size="13" fill="#111">🔑 id           INT, PK, AI</text>
    <text x="54" y="156" font-size="13" fill="#111">login        VARCHAR, UNIQUE</text>
    <text x="54" y="178" font-size="13" fill="#111">password  VARCHAR (хеш)</text>
    <text x="54" y="200" font-size="13" fill="#111">fio            VARCHAR</text>
    <text x="54" y="222" font-size="13" fill="#111">phone      VARCHAR</text>
    <text x="54" y="244" font-size="13" fill="#111">email       VARCHAR</text>
    <text x="54" y="266" font-size="13" fill="#111">created_at DATETIME</text>
  </g>

  <!-- orders -->
  <g>
    <rect x="380" y="70" width="250" height="190" rx="8" fill="#f7f8fa" stroke="#333" stroke-width="2"/>
    <rect x="380" y="70" width="250" height="32" rx="8" fill="#333"/>
    <text x="505" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">orders (заявки)</text>
    <text x="394" y="124" font-size="13" fill="#111">🔑 id            INT, PK, AI</text>
    <text x="394" y="146" font-size="13" fill="#111">🔗 user_id     INT, FK</text>
    <text x="394" y="168" font-size="13" fill="#111">course_name VARCHAR</text>
    <text x="394" y="190" font-size="13" fill="#111">desired_date VARCHAR</text>
    <text x="394" y="212" font-size="13" fill="#111">payment_type VARCHAR</text>
    <text x="394" y="234" font-size="13" fill="#111">status         VARCHAR</text>
    <text x="394" y="256" font-size="13" fill="#111">created_at   DATETIME</text>
  </g>

  <!-- courses -->
  <g>
    <rect x="40" y="340" width="230" height="120" rx="8" fill="#f7f8fa" stroke="#333" stroke-width="2"/>
    <rect x="40" y="340" width="230" height="32" rx="8" fill="#333"/>
    <text x="155" y="362" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">courses (курсы)</text>
    <text x="54" y="394" font-size="13" fill="#111">🔑 id          INT, PK, AI</text>
    <text x="54" y="416" font-size="13" fill="#111">name       VARCHAR</text>
    <text x="54" y="438" font-size="13" fill="#111">is_active   TINYINT</text>
  </g>

  <!-- reviews -->
  <g>
    <rect x="730" y="70" width="240" height="190" rx="8" fill="#f7f8fa" stroke="#333" stroke-width="2"/>
    <rect x="730" y="70" width="240" height="32" rx="8" fill="#333"/>
    <text x="850" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">reviews (отзывы)</text>
    <text x="744" y="124" font-size="13" fill="#111">🔑 id            INT, PK, AI</text>
    <text x="744" y="146" font-size="13" fill="#111">🔗 user_id     INT, FK</text>
    <text x="744" y="168" font-size="13" fill="#111">🔗 order_id    INT, FK</text>
    <text x="744" y="190" font-size="13" fill="#111">course_name VARCHAR</text>
    <text x="744" y="212" font-size="13" fill="#111">rating         TINYINT</text>
    <text x="744" y="234" font-size="13" fill="#111">text           VARCHAR</text>
    <text x="744" y="256" font-size="13" fill="#111">created_at   DATETIME</text>
  </g>

  <!-- feedback (независимая) -->
  <g>
    <rect x="380" y="340" width="250" height="140" rx="8" fill="#f7f8fa" stroke="#333" stroke-width="2"/>
    <rect x="380" y="340" width="250" height="32" rx="8" fill="#333"/>
    <text x="505" y="362" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">feedback (обр. связь)</text>
    <text x="394" y="394" font-size="13" fill="#111">🔑 id          INT, PK, AI</text>
    <text x="394" y="416" font-size="13" fill="#111">name       VARCHAR</text>
    <text x="394" y="438" font-size="13" fill="#111">email       VARCHAR</text>
    <text x="394" y="460" font-size="13" fill="#111">message  VARCHAR</text>
  </g>

  <!-- связи -->
  <line x1="270" y1="170" x2="380" y2="150" stroke="#333" stroke-width="2"/>
  <text x="284" y="160" font-size="13" fill="#333">1</text><text x="360" y="142" font-size="13" fill="#333">∞</text>
  <line x1="630" y1="150" x2="730" y2="150" stroke="#333" stroke-width="2"/>
  <text x="640" y="142" font-size="13" fill="#333">∞</text><text x="712" y="142" font-size="13" fill="#333">1</text>
  <line x1="270" y1="200" x2="744" y2="150" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text x="40" y="520" font-size="13" fill="#555">Связи: users 1—∞ orders (user_id) · users 1—∞ reviews (user_id) · orders 1—∞ reviews (order_id).</text>
  <text x="40" y="540" font-size="13" fill="#555">courses — справочник курсов (название копируется в orders.course_name). feedback — независимая таблица.</text>
  <text x="40" y="566" font-size="12" fill="#888">🔑 — первичный ключ (PK), 🔗 — внешний ключ (FK), AI — автоинкремент.</text>
</svg>
